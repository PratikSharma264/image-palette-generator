<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Palette Generator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, sans-serif;
      background: #eef2ff;
      color: #172033;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
    }

    main {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 20px 60px rgba(41, 49, 87, 0.16);
    }

    h1 { margin-top: 0; }

        form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin: 24px 0;
    }

    input, button {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    #preview {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 18px;
      background: #f3f4f6;
    }

    #palette {
      display: grid;
      gap: 12px;
    }

    .swatch {
      overflow: hidden;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: white;
    }

    .color-chip { height: 82px; }

    .color-info {
      margin: 0;
      padding: 10px 12px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.88rem;
    }

    #status { min-height: 24px; }

    @media (max-width: 680px) {
      .workspace { grid-template-columns: 1fr; }
      main { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    
    <h1>AI Image Palette Generator</h1>
    <p>Upload a colorful PNG or JPEG to extract its dominant colors.</p>

    <form id="upload-form">
      <input id="image-file" type="file" accept="image/png,image/jpeg" required>
      <button type="submit">Generate palette</button>
    </form>

    <p id="status" role="status">Choose an image to begin.</p>

    <div class="workspace">
      <img id="preview" alt="Selected image preview" hidden>
      <section id="palette" aria-label="Extracted color palette"></section>
    </div>
  
  </main>

  <script>
    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#image-file");
    const preview = document.querySelector("#preview");
    const palette = document.querySelector("#palette");
    const status = document.querySelector("#status");
    let previewUrl;

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.hidden = false;
      palette.replaceChildren();
      status.textContent = "Preview ready. Generate the palette when you are ready.";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);
      status.textContent = "Clustering image colors...";

      try {
        const response = await fetch("/analyze", {
          method: "POST",
          body: formData,
        });
        const result = await response.json();
                if (!response.ok) {
          throw new Error(result.detail || "The image could not be analyzed.");
        }

        const swatches = result.colors.map((color) => {
          const swatch = document.createElement("article");
          swatch.className = "swatch";

          const chip = document.createElement("div");
          chip.className = "color-chip";
          chip.style.backgroundColor = color.hex;

          const info = document.createElement("p");
          info.className = "color-info";
          info.textContent = `${color.hex} | rgb(${color.rgb.join(", ")}) | ${color.percentage}%`;

          swatch.append(chip, info);
          return swatch;
        });

        palette.replaceChildren(...swatches);
        status.textContent = `Palette generated from ${result.filename}.`;
      } catch (error) {
        palette.replaceChildren();
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Image Palette Generator</title>
  <style>
        /* Custom Slider Track Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #e5e7eb;
      outline: none;
    }

    /* Custom Slider Thumb (Chrome, Edge, Safari) */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4f46e5;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #4338ca;
    }

    /* Custom Slider Thumb (Firefox) */
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: #4f46e5;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    input[type="range"]::-moz-range-thumb:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <main>
    
    <h1>AI Image Palette Generator</h1>
    <p>Upload a colorful PNG or JPEG to extract its dominant colors.</p>

        <form id="upload-form">
      <label>
        Image
        <input id="image-file" type="file" accept="image/png,image/jpeg" required>
      </label>
      <label>
        Colors: <output id="color-output">5</output>
        <input id="color-count" type="range" min="2" max="10" value="5">
      </label>
      <button type="submit">Generate palette</button>
    </form>

    <p id="status" role="status">Choose an image to begin.</p>

    <div class="workspace">
      <img id="preview" alt="Selected image preview" hidden>
      <section id="palette" aria-label="Extracted color palette"></section>
    </div>
  
  </main>

  <script>
    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#image-file");
    const colorCount = document.querySelector("#color-count");
    const colorOutput = document.querySelector("#color-output");
    const preview = document.querySelector("#preview");
    const palette = document.querySelector("#palette");
    const status = document.querySelector("#status");
    let previewUrl;

    colorCount.addEventListener("input", () => {
        colorOutput.value = colorCount.value;
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.hidden = false;
      palette.replaceChildren();
      status.textContent = "Preview ready. Generate the palette when you are ready.";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);
      status.textContent = "Clustering image colors...";

      try {
        const response = await fetch(`/analyze?colors=${colorCount.value}`, {
          method: "POST",
          body: formData,
        });
        const result = await response.json();
                if (!response.ok) {
          throw new Error(result.detail || "The image could not be analyzed.");
        }

        const swatches = result.colors.map((color) => {
          const swatch = document.createElement("article");
          swatch.className = "swatch";

          const chip = document.createElement("div");
          chip.className = "color-chip";
          chip.style.backgroundColor = color.hex;

          const info = document.createElement("p");
          info.className = "color-info";
          info.textContent = `${color.hex} | rgb(${color.rgb.join(", ")}) | ${color.percentage}%`;

          swatch.append(chip, info);
          return swatch;
        });

        palette.replaceChildren(...swatches);
        status.textContent = `Palette generated from ${result.filename}.`;
      } catch (error) {
        palette.replaceChildren();
        status.textContent = error.message;
      }
    });
  </script>
</body>
</html>
